name: Weblate Export Audit

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Download DNSToggle pt_BR file from Weblate
        shell: pwsh
        env:
          WEBLATE_API_TOKEN: ${{ secrets.WEBLATE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WEBLATE_API_TOKEN)) { throw 'WEBLATE_API_TOKEN ausente' }
          $outDir = Join-Path $env:RUNNER_TEMP 'cloud'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $headers = @{ Authorization = "Token $($env:WEBLATE_API_TOKEN)"; Accept = 'application/xml' }
          $url = 'https://hosted.weblate.org/api/translations/elowry/dnstoggle-strings/pt_BR/file/'
          $out = Join-Path $outDir 'strings.xml'
          $response = Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out
          Write-Output ("WEBLATE_STATUS " + [int]$response.StatusCode)
          $bytes = [System.IO.File]::ReadAllBytes($out)
          Write-Output ("WEBLATE_BYTES " + $bytes.Length)
          $head = [System.Text.Encoding]::UTF8.GetString($bytes, 0, [Math]::Min(200, $bytes.Length))
          Write-Output ("WEBLATE_HEAD " + ($head -replace "`r?`n", ' '))
          if (-not $head.TrimStart().StartsWith('<?xml') -and -not $head.Contains('<resources')) { throw 'Arquivo Weblate nao parece XML' }
          Write-Output ("WEBLATE_SHA256 " + (Get-FileHash -LiteralPath $out -Algorithm SHA256).Hash)
      - name: Upload cloud export
        uses: actions/upload-artifact@v4
        with:
          name: cloud-export
          path: ${{ runner.temp }}/cloud
