name: Weblate Units Audit

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: windows-latest
    steps:
      - name: Download DNSToggle live units from Weblate
        shell: pwsh
        env:
          WEBLATE_API_TOKEN: ${{ secrets.WEBLATE_API_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WEBLATE_API_TOKEN)) { throw 'WEBLATE_API_TOKEN ausente' }
          $outDir = Join-Path $env:RUNNER_TEMP 'cloud'
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $headers = @{ Authorization = "Token $($env:WEBLATE_API_TOKEN)"; Accept = 'application/json' }
          $url = 'https://hosted.weblate.org/api/translations/elowry/dnstoggle-strings/pt_BR/units/?page_size=1000'
          $out = Join-Path $outDir 'units.json'
          $response = Invoke-WebRequest -Uri $url -Headers $headers -OutFile $out
          Write-Output ("UNITS_STATUS " + [int]$response.StatusCode)
          Write-Output ("UNITS_BYTES " + (Get-Item $out).Length)
      - name: Upload units
        uses: actions/upload-artifact@v4
        with:
          name: cloud-units
          path: ${{ runner.temp }}/cloud
